name: release
# Push a tag such as v1.0.0 to publish one archive per platform
# (portash_1.0.0_linux_amd64.tar.gz, ...), checksums.txt, the SBOM and a signed
# build provenance attestation (.goreleaser.yaml). Keep the archive naming:
# other tooling downloads and verifies the archives by it. Check a download with:
#   sha256sum -c checksums.txt --ignore-missing
#   gh attestation verify portash_1.0.0_linux_amd64.tar.gz --repo thomaskhub/portash
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the attestation (Sigstore, keyless)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads the tags
      # A supported Go with current security fixes in its standard library
      # (go.mod only sets the oldest Go that can build portash). Keep in step
      # with the lint job in ci.yml.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true # the newest patch, not the runner's cached one
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
