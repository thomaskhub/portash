name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # The Go that releases are built with (release.yml), so govulncheck checks
    # the standard library that ships. Pinned to a minor that staticcheck
    # supports; raise it with both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true # the newest patch, not the runner's cached one
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: staticcheck ./...
      - run: govulncheck ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=darwin go vet ./... && GOOS=windows go vet ./...
      - run: go test -race ./...
      - name: Build release binaries
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/portash-$os-$arch$ext ./cmd/portash
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portash
          path: dist/

  sbom:
    # Keeps sbom/ in step with the dependencies and publishes it as an artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x" # cyclonedx-gomod needs Go 1.23+
          check-latest: true
      - run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.8.0
      - run: ./scripts/sbom.sh
      - name: SBOM is up to date
        run: git diff --exit-code sbom/ || (echo "Run make sbom and commit sbom/" && exit 1)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/

  e2e:
    # Real sshd, ssh, scp and sudo: host CA, stolen tokens, restricted keys,
    # network drops, daily unlock, TOTP sudo, sandbox and recording.
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y openssh-server sudo python3
      - run: sudo env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOCACHE=$(go env GOCACHE)" ./scripts/e2e-local.sh
      - run: sudo env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOCACHE=$(go env GOCACHE)" ./scripts/e2e-server.sh
