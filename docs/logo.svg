<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="portash logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb03a"/>
      <stop offset="0.55" stop-color="#ff5470"/>
      <stop offset="1" stop-color="#8a3cff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="1" stop-color="#fff6c2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#bg)"/>
  <!-- arched doorway -->
  <path d="M64 214 V112 A64 64 0 0 1 192 112 V214 Z" fill="#1b1433"/>
  <!-- light spilling out of the open door -->
  <path d="M150 214 L214 238 L238 214 L192 214 Z" fill="url(#glow)" opacity=".55"/>
  <path d="M150 70 A64 64 0 0 1 192 112 V214 H150 Z" fill="#fff6c2"/>
  <!-- the door, swung open -->
  <path d="M84 116 A44 44 0 0 1 150 78 V214 H84 Z" fill="#2d2357"/>
  <circle cx="141" cy="182" r="6" fill="#ffb03a"/>
  <!-- shell prompt on the door -->
  <path d="M96 128 L114 142 L96 156" fill="none" stroke="#7dffcf" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="118" y="152" width="22" height="8" rx="4" fill="#7dffcf"/>
  <!-- keystone with the port number -->
  <path d="M112 40 H144 L138 64 H118 Z" fill="#fff6c2"/>
  <text x="128" y="58" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" font-size="13" fill="#1b1433">443</text>
</svg>
